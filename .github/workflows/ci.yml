name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export Supabase local credentials
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          supabase status -o env | grep "^ANON_KEY=" | sed 's/ANON_KEY/SUPABASE_ANON_KEY/' >> $GITHUB_ENV
          supabase status -o env | grep "^ANON_KEY=" | sed 's/ANON_KEY/SUPABASE_KEY/' >> $GITHUB_ENV
          supabase status -o env | grep "^SERVICE_ROLE_KEY=" | sed 's/SERVICE_ROLE_KEY/SUPABASE_SERVICE_ROLE_KEY/' >> $GITHUB_ENV
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
